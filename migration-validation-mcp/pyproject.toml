[project]
name = "migration-validation-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "mcp>=1.28.1",
    "numpy>=2.5.1",
    "opencv-python>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pillow>=12.3.0",
    "playwright>=1.61.0",
    "playwright-mcp>=0.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-docx>=1.1.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
migration-validation-mcp = "src.server:run"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]
